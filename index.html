<style>

<script>
// FSRS-5 (Free Spaced Repetition Scheduler) — Anki ishlatadigan zamonaviy algoritm
const W=[0.4072,1.1829,3.1262,15.4722,7.2102,0.5316,1.0651,0.0234,1.616,0.1544,1.0824,1.9813,0.0953,0.2975,2.2042,0.2407,2.9466,0.5034,0.6567];
const F=19/81,DC=-0.5,DAY=864e5;
const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
const Rt=(t,s)=>Math.pow(1+F*t/s,DC);
const Iv=(s,r)=>s/F*(Math.pow(r,1/DC)-1);
const D0=g=>cl(W[4]-Math.exp(W[5]*(g-1))+1,1,10);
const ICON={r:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="3"/><path d="M8 20h8"/></svg>',k:'<svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="13" height="13" rx="3"/><path d="M8 4h10a2.5 2.5 0 0 1 2.500 2.500V16"/></svg>',s:'<svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V5M19 20v-6"/></svg>'};
function nextDue(){const n=Date.now(),d=S.cards.filter(c=>c.s&&c.due>n).map(c=>c.due);return d.length?fmt(Math.min(...d)-n)+' ichida':'hali rejalashtirilmagan'}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
async function askAI(mode,d){
  if(!S.key)throw new Error('Avval Statistika → Sozlamalarda sinxronlash kalitini yarating');
  const r=await fetch('/api?a=ai',{method:'POST',headers:{'x-sync-key':S.key,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({mode},d))});
  const j=await r.json();if(!r.ok)throw new Error(j.e||'AI xatosi');return j;
}
let S={cards:[],ret:0.9,newLim:20,log:[],mult:1,lang:'en-US',typed:false,filter:''},tab='r',cur=null,shown=false;
try{const x=localStorage.getItem('itk');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
let st=null,busy=false;
const save=()=>{S.upd=Date.now();try{localStorage.setItem('itk',JSON.stringify(S))}catch(e){};clearTimeout(st);st=setTimeout(sync,3000)};
function merge(a,b){
  const m=new Map();[...a.cards,...(b.cards||[])].forEach(c=>{const o=m.get(c.id);if(!o||(c.mod||0)>(o.mod||0))m.set(c.id,c)});
  const dd=new Map();[...(a.dead||[]),...(b.dead||[])].forEach(d=>{const o=dd.get(d.id);if(!o||d.mod>o.mod)dd.set(d.id,d)});
  dd.forEach((d,id)=>{const c=m.get(id);if(c&&(c.mod||0)<=d.mod)m.delete(id)});
  const lg=new Map();[...a.log,...(b.log||[])].forEach(l=>lg.set(l.t+'_'+l.g,l));
  const nw=(b.upd||0)>(a.upd||0)?b:a;
  return Object.assign({},nw,{cards:[...m.values()],dead:[...dd.values()],log:[...lg.values()].sort((x,y)=>x.t-y.t).slice(-5000),key:a.key,upd:Math.max(a.upd||0,b.upd||0)});
}
function sync(){
  if(!S.key||busy)return;busy=true;const k=S.key;
  fetch('/api?a=sync',{headers:{'x-sync-key':k}}).then(r=>r.ok?r.json():null).then(rem=>{
    S=merge(S,rem||{cards:[],log:[]});S.key=k;
    try{localStorage.setItem('itk',JSON.stringify(S))}catch(e){}
    return fetch('/api?a=sync',{method:'POST',headers:{'x-sync-key':k,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},S,{key:undefined}))});
  }).catch(()=>{}).finally(()=>{busy=false;if(!shown&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()});
}
function sched(c,g,now){
  let s,d;
  if(!c.s){s=W[g-1];d=D0(g)}
  else{
    const r=Rt(Math.max(0,(now-c.last)/DAY),c.s);
    d=c.d-W[6]*(g-3)*(10-c.d)/9;d=cl(W[7]*D0(4)+(1-W[7])*d,1,10);
    if(g===1)s=Math.min(c.s,W[11]*Math.pow(d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp((1-r)*W[14]));
    else s=c.s*(1+Math.exp(W[8])*(11-d)*Math.pow(c.s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
  }
  s=cl(s,0.01,36500);
  const days=Math.max(1,Math.round(Iv(s,S.ret)*S.mult));
  return{s,d,last:now,due:g===1?now+6e5:now+days*DAY,ms:g===1?6e5:days*DAY};
}
function fmt(ms){const m=ms/6e4;if(m<60)return Math.round(m)+' daq';const d=ms/DAY;if(d<30)return Math.round(d)+' kun';if(d<365)return Math.round(d/30.4)+' oy';return (d/365).toFixed(1)+' yil'}
const startDay=()=>{const d=new Date();d.setHours(0,0,0,0);return+d};
function queue(){
  const now=Date.now(),pool=S.cards.filter(c=>!S.filter||c.tag===S.filter),due=pool.filter(c=>c.s&&c.due<=now).sort((a,b)=>S.mix?((a.id*7919)%1009)-((b.id*7919)%1009):a.due-b.due);
  const used=S.log.filter(l=>l.t>=startDay()&&l.nw).length;
  const nw=pool.filter(c=>!c.s).slice(0,Math.max(0,S.newLim-used));
  return due.concat(nw);
}
  function grade(g){
  const c=cur,now=Date.now(),nw=!c.s;
  S.log.push({t:now,g,nw,rv:!nw,p:nw?0:+Rt(Math.max(0,(now-c.last)/DAY),c.s).toFixed(4)});if(S.log.length>5000)S.log.shift();
  const r=sched(c,g,now);Object.assign(c,r);c.mod=now;delete c.ms;c.reps=(c.reps||0)+1;if(g===1&&!nw)c.lapses=(c.lapses||0)+1;
  save();shown=false;typed='';render();
}
const $=(t,p={},h='')=>Object.assign(document.createElement(t),p,h?{innerHTML:h}:{});
function render(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  [['r','Takrorlash'],['k','Kartalar'],['s','Statistika']].forEach(([k,n])=>{const b=$('button',{className:tab===k?'on':'',onclick:()=>{tab=k;shown=false;render()}});b.innerHTML=ICON[k]+'<span>'+n+'</span>';nav.appendChild(b)});
  const v=document.getElementById('v');v.innerHTML='';
  (tab==='r'?review:tab==='k'?cards:stats)(v);
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=x=>x.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
let typed='',nimg='',nrev=false;
function sp(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.lang;speechSynthesis.speak(u)}catch(e){}}
function calib(){
  const L=S.log.filter(l=>l.rv&&l.p&&l.t>(S.calAt||0));
  if(L.length<50){alert('Kamida 50 ta yangi takrorlash kerak (hozir: '+L.length+')');return}
  const p=cl(L.reduce((a,l)=>a+l.p,0)/L.length,.05,.99),r=cl(L.filter(l=>l.g>1).length/L.length,.05,.99);
  S.mult=cl(S.mult*Math.log(p)/Math.log(r),.5,2);S.calAt=Date.now();save();
  alert('Moslandi. Intervallar koeffitsiyenti: '+S.mult.toFixed(2)+' (kutilgan '+Math.round(p*100)+'%, haqiqiy '+Math.round(r*100)+'%)');render();
}
function review(v){
  const q=queue();cur=q[0];
  const dn=S.log.filter(l=>l.t>=startDay()).length;v.appendChild($('div',{className:'prog'},'<i style="width:'+Math.round(100*dn/Math.max(1,dn+q.length))+'%"></i>'));
  const tags=[...new Set(S.cards.map(c=>c.tag).filter(Boolean))];
  if(tags.length)v.appendChild($('select',{style:'width:100%;padding:8px;margin-bottom:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)',onchange:e=>{S.filter=e.target.value;save();render()}},'<option value="">Barcha mavzular</option>'+tags.map(t=>`<option ${S.filter===t?'selected':''}>${esc(t)}</option>`).join('')));
  if(!cur){v.appendChild($('div',{className:'c'},'<div class="q" style="min-height:190px;flex-direction:column;gap:10px">'+(S.cards.length?'Bugungi ish tugadi<span class="sub">Keyingi takrorlash: '+nextDue()+'</span>':'Birinchi kartangizni qoʻshing<span class="sub">Kartalar boʻlimidan boshlang</span>')+'</div>'));return}
  v.appendChild($('div',{className:'hint',style:'margin-bottom:6px;text-align:center'},`Qolgan: ${q.length} · ${cur.s?'takror':'yangi'}`));
  const c=$('div',{className:'c'});
  if(cur.img)c.appendChild($('img',{src:cur.img,style:'display:block;max-width:100%;max-height:200px;margin:0 auto 8px;border-radius:8px'}));
  const qd=$('div',{className:'q'});qd.innerHTML=esc(cur.q).replace(/\{\{(.+?)\}\}/g,(m,t)=>'<span style="color:var(--gold)">'+(shown?t:'[…]')+'</span>');c.appendChild(qd);
  c.appendChild($('button',{style:'border:0;background:none;font-size:20px',onclick:()=>sp(shown?cur.a:cur.q)},'🔊'));
  if(shown){
    if(typed){const ok=norm(typed)===norm(cur.a);c.appendChild($('div',{className:'hint',style:'text-align:center;color:var(--'+(ok?'g':'r')+')'},(ok?'✓ Toʻgʻri: ':'✗ Siz yozdingiz: ')+esc(typed)))}
    const a=$('div',{className:'a'});a.textContent=cur.a;c.appendChild(a);
    if(cur.m)c.appendChild($('div',{className:'sub',style:'text-align:center;margin-top:14px'},'💡 '+esc(cur.m)));
    else c.appendChild($('button',{style:'display:block;margin:14px auto 0;border:0;background:none;color:var(--gold);font:600 13px var(--sans)',onclick:async e=>{e.target.textContent='...';try{const r=await askAI('explain',{q:cur.q,a:cur.a});cur.m=r.t.trim();cur.mod=Date.now();save();render()}catch(x){alert(x.message);e.target.textContent='✨ AI tushuntirish'}}},'✨ AI tushuntirish'));
  }
  v.appendChild(c);
  if(!shown){
    const go=()=>{typed=inp?inp.value.trim():'';shown=true;render()};
    var inp=S.typed?$('input',{placeholder:'Javobni yozing...',onkeydown:e=>{if(e.key==='Enter')go()}}):null;
    if(inp)v.appendChild(inp);
    if(inp&&SR)v.appendChild($('button',{style:'border:0;background:none;color:var(--gold);font:600 13px var(--sans);margin-bottom:8px',onclick:()=>{const r=new SR();r.lang=S.lang;r.onresult=e=>{inp.value=e.results[0][0].transcript;go()};r.start()}},'🎤 Ovoz bilan javob'));
    v.appendChild($('button',{className:'btn',onclick:go},S.typed?'Tekshirish':'Javobni koʻrsatish'));
  }else{
    const gr=$('div',{className:'grades'}),now=Date.now();
    [['Xato',1],['Qiyin',2],['Yaxshi',3],['Oson',4]].forEach(([n,g])=>gr.appendChild($('button',{onclick:()=>grade(g)},`${n}<small>${fmt(sched(cur,g,now).ms)}</small>`)));
    v.appendChild(gr);
  }
}
function cards(v){
  const a=$('div',{className:'c'},'<h2>Yangi karta</h2>');
  const q=$('input',{placeholder:'Savol yoki cloze: Poytaxt — {{Toshkent}}'}),an=$('input',{placeholder:'Javob'}),tg=$('input',{placeholder:'Mavzu (ixtiyoriy)'});
  const im=$('input',{type:'file',accept:'image/*',onchange:e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{const k=Math.min(1,360/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=i.width*k;cv.height=i.height*k;cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);nimg=cv.toDataURL('image/jpeg',.7)};i.src=URL.createObjectURL(f)}});
  const rv=$('label',{className:'hint',style:'display:block;margin-bottom:8px'},'<input type="checkbox" style="width:auto;margin-right:6px"'+(nrev?' checked':'')+'> Teskari karta ham yaratilsin');
  rv.firstChild.onchange=e=>{nrev=e.target.checked};
  const mk=(x,y,i,m)=>{const t=tg.value.trim(),id=Date.now()+Math.random(),cz=/\{\{.+?\}\}/.test(x);if(cz&&!y)y=[...x.matchAll(/\{\{(.+?)\}\}/g)].map(z=>z[1]).join(', ');S.cards.push({id,q:x,a:y,tag:t,img:i||'',m:m||'',mod:Date.now()});if(nrev&&!cz)S.cards.push({id:id+.5,q:y,a:x,tag:t,mod:Date.now()})};
  const add=$('button',{className:'btn',onclick:()=>{const x=q.value.trim(),y=an.value.trim();if(!x||(!y&&!/\{\{.+?\}\}/.test(x)))return;mk(x,y,nimg);nimg='';save();render()}});add.textContent='Qoʻshish';
  if(window._pre){q.value=window._pre;window._pre=''}
